spring:
  application:
    name: order-service

  datasource:
    url: jdbc:postgresql://localhost:5435/order_db
    username: order_app
    password: order_app_password

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  mvc:
    problemdetails:
      enabled: true
  cloud:
    loadbalancer:
      cache:
        ttl: 5s          # default 35s — stale instance lists die faster
        # enabled: false # nuclear option for learning: always ask DiscoveryClient
server:
  port: 8083

logging:
  level:
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
    org.springframework.cloud.loadbalancer: DEBUG
    com.example.microservices.order.client.feign: DEBUG

# Feign resolves product-service and inventory-service through Eureka.
clients:
  product-service:
    connect-timeout: 500ms
    read-timeout: 2s
    max-connections: 50
    max-connections-per-route: 20

  inventory-service:
    connect-timeout: 500ms
    read-timeout: 2s
    max-connections: 50
    max-connections-per-route: 20

eureka:
  client:
    registry-fetch-interval-seconds: 5   # default 30 — pull Eureka more often
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    # Local same-machine: advertise localhost, not the LAN IP.
    hostname: localhost
    prefer-ip-address: false
