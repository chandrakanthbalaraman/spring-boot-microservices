spring:
  application:
    name: order-service

  datasource:
    url: jdbc:postgresql://localhost:5435/order_db
    username: order_app
    password: order_app_password

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  mvc:
    problemdetails:
      enabled: true
server:
  port: 8083

logging:
  level:
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
    com.example.microservices.order.client.feign: DEBUG

# Feign resolves product-service and inventory-service through Eureka.
# base-url is only the leftover RestClient beans; those need an absolute URL.
clients:
  product-service:
    base-url: http://localhost:8081
    connect-timeout: 500ms
    read-timeout: 2s
    max-connections: 50
    max-connections-per-route: 20

  inventory-service:
    base-url: http://localhost:8082
    connect-timeout: 500ms
    read-timeout: 2s
    max-connections: 50
    max-connections-per-route: 20

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    # Local same-machine: advertise localhost, not the LAN IP.
    hostname: localhost
    prefer-ip-address: false
