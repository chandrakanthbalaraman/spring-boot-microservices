spring:
  application:
    name: product-service

  datasource:
    url: ${PRODUCT_DB_URL}
    username: ${PRODUCT_DB_USERNAME}
    password: ${PRODUCT_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  mvc:
    problemdetails:
      enabled: true

  config:
    import: configserver:http://localhost:8888

logging:
  level:
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    # Local same-machine: advertise localhost, not the LAN IP.
    # prefer-ip-address:true made Feign call 192.168.1.234 → Tomcat SocketException.
    hostname: localhost
    prefer-ip-address: false
management:
  endpoints:
    web:
      exposure:
        include: health,info,refresh
