spring:
  application:
    name: product-service

  datasource:
    url: jdbc:postgresql://localhost:5433/product_db
    username: product_app
    password: product_app_password
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  mvc:
    problemdetails:
      enabled: true

server:
  port: 8081

logging:
  level:
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    # Local same-machine: advertise localhost, not the LAN IP.
    # prefer-ip-address:true made Feign call 192.168.1.234 → Tomcat SocketException.
    hostname: localhost
    prefer-ip-address: false