spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          metrics:
            enabled: true
          routes:
            # Slice A — one route only. Product/inventory routes land in Slice B.
            - id: order-service
              uri: lb://order-service
              predicates:
                - Path=/api/v1/orders/**
            # Slice B — two routes. Product service routes land in Slice B.
            - id: product-service
              uri: lb://product-service
              predicates:
                - Path=/api/v1/products/**
            # Slice B — two routes. Inventory service routes land in Slice C.
            - id: inventory-service
              uri: lb://inventory-service
              predicates:
                - Path=/api/v1/inventories/**

server:
  port: 8080

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    hostname: localhost
    prefer-ip-address: false

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    org.springframework.cloud.loadbalancer: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics